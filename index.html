<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Missão Financeira</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="site">

    <section class="hero">

      <!-- IMAGEM PRINCIPAL -->
      <div class="hero-bg">
        <img src="assets/hero-bg1.PNG" alt="Mulher usando o app Missão Financeira">
      </div>

      <!-- EFEITOS DO FUNDO -->
      <div class="hero-overlay"></div>
      <div class="hero-grid"></div>
      <div class="hero-glow"></div>

      <!-- CARD GLASS FLUTUANTE -->
      <div class="level-card">
        <div class="level-top">
          <div class="level-badge">
            ✦
          </div>

          <div class="level-info">
            <span>NÍVEL 7</span>
            <p>Foco e disciplina</p>
            <strong><b>2.450</b> / 3.000 XP</strong>
          </div>

          <div class="xp-pill">+120 XP</div>
        </div>

        <div class="level-progress">
          <div></div>
        </div>

        <div class="achievements-box">
          <h4>CONQUISTAS</h4>

          <div class="achievements-grid">
            <div>
              <span>⌖</span>
              <p>Meta mensal<br>concluída</p>
            </div>

            <div>
              <span>↗</span>
              <p>Sequência<br>10 dias</p>
            </div>

            <div>
              <span>♕</span>
              <p>Patrimônio<br>em alta</p>
            </div>
          </div>
        </div>
      </div>

      <!-- TEXTO DA HERO -->
      <div class="hero-content">
        <h1>
          Controle total<br>
          da sua vida<br>
          financeira
        </h1>

        <p class="hero-subtitle">
          Ganhos, saídas, contas, metas<br>
          e evolução em um só app.
        </p>

        <img src="assets/logo-missao.PNG" alt="Missão Financeira" class="hero-logo-small">

        <a href="#planos" class="hero-button">
          <span>Iniciar missão</span>
          <strong>›</strong>
        </a>
      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
